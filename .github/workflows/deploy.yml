name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Redeploy after building"
        type: boolean
        default: true
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  id-token: write
env:
  IMAGE: ghcr.io/copokbl/hexstake
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          tags: tag:komodo-deployer
      - name: Redeploy via Komodo
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_DEPLOYMENT: ${{ secrets.KOMODO_DEPLOYMENT }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: bash deploy/komodo-deploy.sh
      - name: Wait for the new version to go live
        run: bash deploy/wait-live.sh "${{ needs.image.outputs.tag }}"
